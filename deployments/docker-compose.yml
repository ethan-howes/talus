# Talus Prototype Docker Compose

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: talus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ..
      dockerfile: deployments/docker/ingestion.Dockerfile
    container_name: talus-ingestion
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "${S1_LISTEN_PORT}:8081"
    volumes:
      - dem_data:/data/dem
    depends_on:
      postgres:
        condition: service_healthy

    terrain:
      build:
        context: ..
        dockerfile: deployments/docker/terrain.Dockerfile
      container_name: talis-terrain
      restart: unless-stopped
      env_file: ../.env
      ports:
        - "${S2_LISTEN_PORT}:8082"
      volumes:
        - dem_data:/data/dem
      depends_on:
        postgres:
          condition: service_healthy
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]

    hazard:
      build:
        context: ..
        dockerfile: deployments/docker/hazard.Dockerfile
      container_name: talus-hazard
      restart: unless-stopped
      env_file: ../.env
      ports:
        - "${S4_LISTEN_PORT}"
      depends_on:
        postgres:
          condition: service_healthy


volumes:
  postgres_data:
    driver: local


